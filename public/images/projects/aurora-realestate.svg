<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="auroraShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect width="700" height="440" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Browser Chrome / Tab -->
  <rect width="700" height="36" rx="10" fill="#070C1E" />
  <circle cx="20" cy="18" r="5" fill="#EF4444" />
  <circle cx="36" cy="18" r="5" fill="#F59E0B" />
  <circle cx="52" cy="18" r="5" fill="#10B981" />
  <rect x="120" y="8" width="460" height="20" rx="10" fill="#151E38" stroke="#334155" stroke-width="1"/>
  <text x="350" y="22" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">https://auroraluxuryrealty.com/estates/sky-penthouse</text>

  <!-- Navigation Bar -->
  <rect y="36" width="700" height="48" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
  <text x="25" y="65" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="17" font-weight="800" letter-spacing="2">AURORA <tspan fill="#F59E0B">REALTY</tspan></text>
  <text x="210" y="65" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Exclusive Estates</text>
  <text x="330" y="65" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">3D Virtual Tours</text>
  <text x="450" y="65" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Private Concierge</text>
  <rect x="560" y="47" width="115" height="26" rx="13" fill="url(#goldGrad)" />
  <text x="617" y="64" fill="#0B132B" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Request VIP Showing</text>

  <!-- Luxury Hero Showcase -->
  <g transform="translate(24, 98)">
    <!-- Architectural Hero Image simulation -->
    <rect width="652" height="210" rx="10" fill="#1E293B" filter="url(#auroraShadow)"/>
    <!-- Building & Horizon silhoutte -->
    <path d="M 0 160 L 120 110 L 220 140 L 320 80 L 460 130 L 580 90 L 652 140 L 652 210 L 0 210 Z" fill="#0F172A" opacity="0.8"/>
    <!-- Sun/Moon Glow -->
    <circle cx="560" cy="70" r="35" fill="#F59E0B" opacity="0.2"/>
    <circle cx="560" cy="70" r="18" fill="#FDE68A" opacity="0.7"/>

    <!-- Overlay Badge & Details -->
    <rect x="25" y="25" width="130" height="24" rx="4" fill="#0B132B" opacity="0.9"/>
    <text x="90" y="41" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">EXCLUSIVE LISTING</text>

    <text x="25" y="85" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="800">The Obsidian Sky Penthouse</text>
    <text x="25" y="110" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">Marine Drive, Mumbai • 8,400 Sq Ft • 360° Arabian Sea Panoramas</text>

    <rect x="25" y="140" width="140" height="36" rx="6" fill="url(#goldGrad)"/>
    <text x="95" y="163" fill="#0B132B" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">₹38.50 Cr</text>

    <!-- 3D Tour CTA Button -->
    <rect x="180" y="140" width="160" height="36" rx="6" fill="#0B132B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="260" y="163" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">▷ Launch 3D Tour</text>

    <!-- Specs Grid -->
    <g transform="translate(0, 225)">
      <rect width="150" height="85" rx="8" fill="#151E38" stroke="#1E293B"/>
      <text x="20" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">BEDROOMS</text>
      <text x="20" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="700">5 Suites</text>

      <rect x="166" width="150" height="85" rx="8" fill="#151E38" stroke="#1E293B"/>
      <text x="186" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">BATHROOMS</text>
      <text x="186" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="700">6 Spa Baths</text>

      <rect x="332" width="150" height="85" rx="8" fill="#151E38" stroke="#1E293B"/>
      <text x="352" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">PRIVATE AMENITIES</text>
      <text x="352" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Infinity Pool</text>

      <rect x="498" width="154" height="85" rx="8" fill="#151E38" stroke="#1E293B"/>
      <text x="518" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">PARKING</text>
      <text x="518" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="700">4 Vehicles</text>
    </g>
  </g>
</svg>
