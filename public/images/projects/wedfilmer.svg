<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <defs>
    <linearGradient id="wed_hero_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12" />
      <stop offset="60%" stop-color="#1A181D" />
      <stop offset="100%" stop-color="#2D241E" />
    </linearGradient>
    <linearGradient id="gold_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Browser Frame -->
  <rect width="700" height="440" rx="12" fill="#0D0D11" stroke="#27272A" stroke-width="2"/>
  <rect width="700" height="38" rx="12" fill="#09090B" />
  <circle cx="20" cy="19" r="5" fill="#EF4444" />
  <circle cx="36" cy="19" r="5" fill="#F59E0B" />
  <circle cx="52" cy="19" r="5" fill="#10B981" />
  <rect x="120" y="8" width="460" height="22" rx="11" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <text x="350" y="23" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">https://wedfilmer.in</text>

  <!-- Luxury Nav -->
  <rect y="38" width="700" height="50" fill="#0D0D11" stroke="#27272A" stroke-width="1"/>
  <text x="30" y="70" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700" letter-spacing="1">WED<tspan fill="#F59E0B">FILMER</tspan></text>
  <text x="230" y="68" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Home</text>
  <text x="290" y="68" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="12">About</text>
  <text x="350" y="68" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="12">Services</text>
  <text x="420" y="68" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="12">Portfolio</text>
  <rect x="565" y="49" width="105" height="28" rx="14" fill="url(#gold_grad)"/>
  <text x="617" y="67" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Book Now</text>

  <!-- Hero Cinema Showcase -->
  <g transform="translate(25, 102)">
    <rect width="650" height="175" rx="12" fill="url(#wed_hero_grad)" stroke="#3F3F46" stroke-width="1"/>
    <!-- Decorative cinema elements -->
    <circle cx="560" cy="85" r="70" fill="#F59E0B" opacity="0.12"/>
    <circle cx="560" cy="85" r="50" fill="#FBBF24" opacity="0.15"/>
    <!-- Play button overlay -->
    <circle cx="560" cy="85" r="28" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="555,75 570,85 555,95" fill="#000000"/>
    
    <rect x="30" y="24" width="160" height="22" rx="11" fill="#27272A" stroke="#3F3F46"/>
    <text x="110" y="39" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">✨ WEDDING STORYTELLING</text>
    
    <text x="30" y="80" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700">Your Story, <tspan fill="url(#gold_grad)">Beautifully Told</tspan></text>
    <text x="30" y="108" fill="#D4D4D8" font-family="system-ui, sans-serif" font-size="13" font-weight="300">Cinematic wedding films and luxury photography crafted into timeless memories.</text>
    <text x="30" y="130" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">From intimate vows to grand destination celebrations worldwide.</text>
    
    <rect x="30" y="142" width="140" height="30" rx="15" fill="#FFFFFF"/>
    <text x="100" y="161" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Let's Tell Your Story →</text>
  </g>

  <!-- 3 Stats & Features -->
  <g transform="translate(25, 292)">
    <!-- Metric 1 -->
    <rect width="206" height="124" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
    <text x="20" y="44" fill="url(#gold_grad)" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="800">350+</text>
    <text x="20" y="70" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Weddings Covered</text>
    <text x="20" y="90" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">Intimate vows &amp; luxury destination events.</text>

    <!-- Metric 2 -->
    <g transform="translate(222, 0)">
      <rect width="206" height="124" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
      <text x="20" y="44" fill="url(#gold_grad)" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="800">11+ Yrs</text>
      <text x="20" y="70" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Mastery Experience</text>
      <text x="20" y="90" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">Award-winning cinema direction &amp; editing.</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(444, 0)">
      <rect width="206" height="124" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
      <text x="20" y="44" fill="url(#gold_grad)" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="800">4.9 ★</text>
      <text x="20" y="70" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Client Rating</text>
      <text x="20" y="90" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="11">Over 1,000+ ecstatic reviews &amp; testimonials.</text>
    </g>
  </g>
</svg>
