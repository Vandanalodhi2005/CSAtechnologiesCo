      <text x="25" y="68" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Instant AI Printer Diagnostics & Troubleshooting</text>
      <text x="25" y="90" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Resolve spooler errors, driver conflicts & wireless printer offline issues in seconds.</text>
      <rect x="510" y="38" width="115" height="34" rx="6" fill="#0284C7"/>
      <text x="567" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Run Free Scan</text>
