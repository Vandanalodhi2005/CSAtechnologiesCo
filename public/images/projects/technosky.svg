<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <!-- Browser Frame -->
  <rect width="700" height="440" rx="10" fill="#0A1628" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Browser Chrome / Tab -->
  <rect width="700" height="36" rx="10" fill="#060F1E" />
  <circle cx="20" cy="18" r="5" fill="#EF4444" />
  <circle cx="36" cy="18" r="5" fill="#F59E0B" />
  <circle cx="52" cy="18" r="5" fill="#10B981" />
  <rect x="120" y="8" width="460" height="20" rx="10" fill="#0D1F38" stroke="#1E3A5F" stroke-width="1"/>
  <text x="350" y="22" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">https://technosky.io/cloud-solutions</text>

  <!-- Dark Mode Corporate Navbar -->
  <rect y="36" width="700" height="46" fill="#0A1628" stroke="#132742" stroke-width="1"/>
  <text x="25" y="65" fill="#38BDF8" font-family="sans-serif" font-size="18" font-weight="800">Techno<tspan fill="#FFFFFF">Sky</tspan></text>
  <text x="170" y="64" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600">Solutions</text>
  <text x="255" y="64" fill="#94A3B8" font-family="sans-serif" font-size="12">Cloud Architecture</text>
  <text x="385" y="64" fill="#94A3B8" font-family="sans-serif" font-size="12">Security</text>
  <text x="460" y="64" fill="#94A3B8" font-family="sans-serif" font-size="12">Enterprise</text>
  <rect x="560" y="46" width="115" height="26" rx="13" fill="#0284C7" />
  <text x="617" y="63" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Schedule Demo</text>

  <!-- Hero Section -->
  <g transform="translate(25, 95)">
    <rect width="650" height="135" rx="8" fill="#0E2340" stroke="#1D4A7A" stroke-width="1"/>
    <text x="25" y="35" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">NEXT-GEN CLOUD ORCHESTRATION</text>
    <text x="25" y="68" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">Enterprise Cloud Infrastructure &amp; Security</text>
    <text x="25" y="92" fill="#94A3B8" font-family="sans-serif" font-size="12">Automated microservice deployments, zero-trust security mesh, and 99.999% SLA.</text>
    
    <rect x="25" y="102" width="95" height="22" rx="4" fill="#0284C7" />
    <text x="72" y="117" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Explore Cloud</text>
    <rect x="130" y="102" width="105" height="22" rx="4" fill="transparent" stroke="#38BDF8" stroke-width="1"/>
    <text x="182" y="117" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Documentation</text>
  </g>

  <!-- Feature Grid -->
  <g transform="translate(25, 245)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="205" height="170" rx="8" fill="#0C1B33" stroke="#1D3E6B" stroke-width="1"/>
    <rect x="15" y="15" width="36" height="36" rx="6" fill="#0284C7" fill-opacity="0.2"/>
    <text x="33" y="38" fill="#38BDF8" font-family="sans-serif" font-size="18" text-anchor="middle">☁️</text>
    <text x="15" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Multi-Cloud Mesh</text>
    <text x="15" y="96" fill="#94A3B8" font-family="sans-serif" font-size="11">Seamless hybrid routing across AWS, GCP and Azure clusters.</text>
    <text x="15" y="145" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="600">Learn More →</text>

    <!-- Card 2 -->
    <rect x="222" y="0" width="205" height="170" rx="8" fill="#0C1B33" stroke="#1D3E6B" stroke-width="1"/>
    <rect x="237" y="15" width="36" height="36" rx="6" fill="#0284C7" fill-opacity="0.2"/>
    <text x="255" y="38" fill="#38BDF8" font-family="sans-serif" font-size="18" text-anchor="middle">🔒</text>
    <text x="237" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Zero-Trust Shield</text>
    <text x="237" y="96" fill="#94A3B8" font-family="sans-serif" font-size="11">Automated mTLS encryption with real-time anomaly isolation.</text>
    <text x="237" y="145" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="600">Learn More →</text>

    <!-- Card 3 -->
    <rect x="445" y="0" width="205" height="170" rx="8" fill="#0C1B33" stroke="#1D3E6B" stroke-width="1"/>
    <rect x="460" y="15" width="36" height="36" rx="6" fill="#0284C7" fill-opacity="0.2"/>
    <text x="478" y="38" fill="#38BDF8" font-family="sans-serif" font-size="18" text-anchor="middle">⚡</text>
    <text x="460" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Auto-Scaling K8s</text>
    <text x="460" y="96" fill="#94A3B8" font-family="sans-serif" font-size="11">Sub-second pod spin-up with AI-assisted predictive scaling.</text>
    <text x="460" y="145" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="600">Learn More →</text>
  </g>
</svg>
