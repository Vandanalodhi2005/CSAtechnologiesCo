<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <defs>
    <linearGradient id="realty_hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="50%" stop-color="#0D3060" />
      <stop offset="100%" stop-color="#C8A96E" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="gold_realty" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A96E" />
      <stop offset="50%" stop-color="#E2C787" />
      <stop offset="100%" stop-color="#B8934A" />
    </linearGradient>
  </defs>

  <!-- Browser Frame -->
  <rect width="700" height="440" rx="12" fill="#F8F9FB" stroke="#E2E8F0" stroke-width="2"/>
  <rect width="700" height="38" rx="12" fill="#1A2744" />
  <circle cx="20" cy="19" r="5" fill="#EF4444" />
  <circle cx="36" cy="19" r="5" fill="#F59E0B" />
  <circle cx="52" cy="19" r="5" fill="#10B981" />
  <rect x="120" y="8" width="460" height="22" rx="11" fill="#243055" stroke="#344470" stroke-width="1"/>
  <text x="350" y="23" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">https://therealtyxperts.in</text>

  <!-- Premium Nav -->
  <rect y="38" width="700" height="52" fill="#FFFFFF" stroke="#E8EBF0" stroke-width="1"/>
  <text x="25" y="72" fill="#0A2540" font-family="Georgia, serif" font-size="17" font-weight="700" letter-spacing="0.5">THE REALTY</text>
  <text x="160" y="72" fill="#C8A96E" font-family="Georgia, serif" font-size="17" font-weight="700" letter-spacing="0.5"> XPERTS</text>
  <text x="240" y="70" fill="#C8A96E" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Properties</text>
  <text x="310" y="70" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Buy</text>
  <text x="350" y="70" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Rent</text>
  <text x="395" y="70" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Invest</text>
  <text x="445" y="70" fill="#475569" font-family="system-ui, sans-serif" font-size="11">About</text>
  <rect x="560" y="50" width="115" height="28" rx="5" fill="url(#gold_realty)"/>
  <text x="617" y="68" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Schedule Visit</text>

  <!-- Hero Banner -->
  <g transform="translate(0, 90)">
    <rect width="700" height="165" fill="url(#realty_hero)"/>
    <!-- Building silhouette decorative -->
    <rect x="510" y="30" width="8" height="100" fill="#C8A96E" opacity="0.3"/>
    <rect x="530" y="50" width="6" height="80" fill="#C8A96E" opacity="0.2"/>
    <rect x="548" y="15" width="10" height="115" fill="#C8A96E" opacity="0.35"/>
    <rect x="570" y="40" width="7" height="90" fill="#C8A96E" opacity="0.2"/>
    <rect x="590" y="20" width="12" height="110" fill="#C8A96E" opacity="0.4"/>
    <rect x="615" y="55" width="8" height="75" fill="#C8A96E" opacity="0.25"/>
    <rect x="635" y="30" width="9" height="100" fill="#C8A96E" opacity="0.3"/>
    <rect x="658" y="45" width="7" height="85" fill="#C8A96E" opacity="0.2"/>
    <rect x="678" y="25" width="8" height="105" fill="#C8A96E" opacity="0.35"/>

    <text x="35" y="42" fill="#C8A96E" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="2">PREMIUM REAL ESTATE &amp; INVESTMENT</text>
    <text x="35" y="82" fill="#FFFFFF" font-family="Georgia, serif" font-size="28" font-weight="700">Find Your Dream</text>
    <text x="35" y="116" fill="#E2C787" font-family="Georgia, serif" font-size="28" font-weight="700">Property Today</text>
    <text x="35" y="144" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Premium residential, commercial &amp; high-yield investment opportunities.</text>
  </g>

  <!-- Search Bar -->
  <g transform="translate(25, 265)">
    <rect width="650" height="48" rx="8" fill="#FFFFFF" stroke="#C8A96E" stroke-width="1.5"/>
    <text x="20" y="29" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">🔍  Search by location, property type, or budget...</text>
    <rect x="550" y="8" width="90" height="32" rx="6" fill="url(#gold_realty)"/>
    <text x="595" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Search</text>
  </g>

  <!-- 3 Property Category Cards -->
  <g transform="translate(25, 328)">
    <!-- Card 1 -->
    <rect width="206" height="94" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="206" height="6" rx="10" fill="url(#gold_realty)"/>
    <text x="20" y="36" fill="#0A2540" font-family="Georgia, serif" font-size="14" font-weight="700">Residential</text>
    <text x="20" y="56" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Luxury villas, apartments &amp; townships.</text>
    <text x="20" y="80" fill="#C8A96E" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Explore Homes →</text>

    <!-- Card 2 -->
    <g transform="translate(222, 0)">
      <rect width="206" height="94" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect width="206" height="6" rx="10" fill="#0A2540"/>
      <text x="20" y="36" fill="#0A2540" font-family="Georgia, serif" font-size="14" font-weight="700">Commercial</text>
      <text x="20" y="56" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Office spaces, retail &amp; commercial plots.</text>
      <text x="20" y="80" fill="#0A2540" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Office &amp; Retail →</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(444, 0)">
      <rect width="206" height="94" rx="10" fill="url(#gold_realty)"/>
      <text x="20" y="36" fill="#FFFFFF" font-family="Georgia, serif" font-size="14" font-weight="700">Investment</text>
      <text x="20" y="56" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="11">High-yield property investment portfolios.</text>
      <text x="20" y="80" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Expert Guidance →</text>
    </g>
  </g>
</svg>
