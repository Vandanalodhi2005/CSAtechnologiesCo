<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <!-- Browser Frame -->
  <rect width="700" height="440" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Browser Chrome / Tab -->
  <rect width="700" height="36" rx="10" fill="#F1F5F9" />
  <circle cx="20" cy="18" r="5" fill="#EF4444" />
  <circle cx="36" cy="18" r="5" fill="#F59E0B" />
  <circle cx="52" cy="18" r="5" fill="#10B981" />
  <rect x="120" y="8" width="460" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="350" y="22" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">https://smarteprint.com/quote-calculator</text>

  <!-- Navbar -->
  <rect y="36" width="700" height="46" fill="#0F172A" />
  <text x="25" y="65" fill="#38BDF8" font-family="sans-serif" font-size="18" font-weight="800">Smart<tspan fill="#FFFFFF">Eprint</tspan></text>
  <text x="180" y="64" fill="#E2E8F0" font-family="sans-serif" font-size="12">Instant Price Calculator</text>
  <text x="340" y="64" fill="#94A3B8" font-family="sans-serif" font-size="12">Business Cards</text>
  <text x="450" y="64" fill="#94A3B8" font-family="sans-serif" font-size="12">Brochures &amp; Catalogs</text>
  <rect x="580" y="47" width="95" height="26" rx="13" fill="#0B84F3" />
  <text x="627" y="64" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Upload File</text>

  <!-- Interactive Print Price Calculator Layout -->
  <g transform="translate(25, 95)">
    <!-- Left: Configurator -->
    <rect x="0" y="0" width="400" height="325" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="30" fill="#0B1220" font-family="sans-serif" font-size="14" font-weight="700">Custom Commercial Print Configurator</text>
    
    <!-- Step 1: Product Select -->
    <text x="20" y="65" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600">1. SELECT PRODUCT TYPE</text>
    <rect x="20" y="75" width="110" height="32" rx="4" fill="#0B84F3" />
    <text x="75" y="95" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Brochure A4</text>
    
    <rect x="140" y="75" width="110" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="195" y="95" fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">Flyer A5</text>
    
    <rect x="260" y="75" width="110" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="315" y="95" fill="#334155" font-family="sans-serif" font-size="11" text-anchor="middle">Packaging Box</text>

    <!-- Step 2: Paper GSM -->
    <text x="20" y="135" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600">2. PAPER WEIGHT &amp; COATING</text>
    <rect x="20" y="145" width="170" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="30" y="165" fill="#0B1220" font-family="sans-serif" font-size="11">350 GSM Gloss Art Card ▼</text>
    
    <rect x="200" y="145" width="170" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="210" y="165" fill="#0B1220" font-family="sans-serif" font-size="11">Velvet Matte Lam ▼</text>

    <!-- Step 3: Quantity Slider -->
    <text x="20" y="205" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600">3. QUANTITY BREAK: <tspan fill="#0B84F3" font-weight="700">2,500 Units</tspan></text>
    <line x1="20" y1="225" x2="370" y2="225" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="225" x2="220" y2="225" stroke="#0B84F3" stroke-width="4" stroke-linecap="round"/>
    <circle cx="220" cy="225" r="8" fill="#0B84F3" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Step 4: Turnaround -->
    <text x="20" y="260" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600">4. PRODUCTION SPEED</text>
    <rect x="20" y="270" width="170" height="32" rx="4" fill="#EFF6FF" stroke="#0B84F3" stroke-width="1"/>
    <text x="30" y="290" fill="#0B84F3" font-family="sans-serif" font-size="11" font-weight="600">🚀 Express 24-48 Hours</text>
    
    <rect x="200" y="270" width="170" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="210" y="290" fill="#64748B" font-family="sans-serif" font-size="11">Standard 3-5 Days</text>

    <!-- Right: Summary Box -->
    <rect x="420" y="0" width="230" height="325" rx="8" fill="#0F172A" />
    <text x="440" y="30" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">DYNAMIC QUOTE SUMMARY</text>
    
    <text x="440" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="800">₹4,850</text>
    <text x="440" y="90" fill="#34D399" font-family="sans-serif" font-size="11">₹1.94 / unit (Best Value)</text>

    <line x1="440" y1="110" x2="630" y2="110" stroke="#334155" stroke-width="1"/>
    
    <text x="440" y="135" fill="#94A3B8" font-family="sans-serif" font-size="11">Pre-flight File Check:</text>
    <text x="630" y="135" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="end">PASSED (300 DPI)</text>

    <text x="440" y="165" fill="#94A3B8" font-family="sans-serif" font-size="11">Proof Approval:</text>
    <text x="630" y="165" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="end">Instant 3D PDF</text>

    <text x="440" y="195" fill="#94A3B8" font-family="sans-serif" font-size="11">Estimated Dispatch:</text>
    <text x="630" y="195" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="end">Tomorrow 4 PM</text>

    <rect x="440" y="240" width="190" height="40" rx="6" fill="#0B84F3" />
    <text x="535" y="265" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Proceed to Print →</text>
  </g>
</svg>
