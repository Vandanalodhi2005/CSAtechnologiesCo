<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <defs>
    <linearGradient id="synclink_hero_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Browser Chrome / Frame -->
  <rect width="700" height="440" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect width="700" height="38" rx="12" fill="#0F172A" />
  <circle cx="20" cy="19" r="5" fill="#EF4444" />
  <circle cx="36" cy="19" r="5" fill="#F59E0B" />
  <circle cx="52" cy="19" r="5" fill="#10B981" />
  <rect x="120" y="8" width="460" height="22" rx="11" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="350" y="23" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">https://synclinktechnologies.com</text>

  <!-- Navbar -->
  <rect y="38" width="700" height="50" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
  <text x="25" y="70" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="16" font-weight="900" letter-spacing="-0.5">SYNCLINK<tspan fill="#2563EB" font-weight="600">TECH</tspan></text>
  <text x="210" y="68" fill="#2563EB" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Home</text>
  <text x="270" y="68" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">About Us</text>
  <text x="345" y="68" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">Services</text>
  <text x="415" y="68" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">Technologies</text>
  <rect x="560" y="49" width="115" height="28" rx="14" fill="#2563EB"/>
  <text x="617" y="67" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Contact Us</text>

  <!-- Hero Banner -->
  <g transform="translate(25, 102)">
    <rect width="650" height="150" rx="12" fill="url(#synclink_hero_grad)"/>
    <circle cx="580" cy="50" r="80" fill="#60A5FA" opacity="0.25"/>
    <circle cx="500" cy="120" r="50" fill="#93C5FD" opacity="0.2"/>
    
    <text x="30" y="38" fill="#BFDBFE" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">IT SERVICES &amp; CONSULTANCY</text>
    <text x="30" y="72" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Synclink Technologies</text>
    <text x="30" y="98" fill="#E0E7FF" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Your Partner in Modern IT, Data Engineering &amp; Software Solutions</text>
    <text x="30" y="122" fill="#BFDBFE" font-family="system-ui, sans-serif" font-size="11">Empowering global enterprises with Full-Stack Engineering, BI &amp; Cloud Infrastructure.</text>
    
    <rect x="500" y="95" width="125" height="34" rx="17" fill="#FFFFFF"/>
    <text x="562" y="117" fill="#1D4ED8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Explore Solutions →</text>
  </g>

  <!-- 3 Service Feature Cards -->
  <g transform="translate(25, 266)">
    <!-- Card 1 -->
    <rect width="206" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#DBEAFE"/>
    <text x="36" y="42" fill="#1D4ED8" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">📊</text>
    <text x="18" y="78" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Business Intelligence</text>
    <text x="18" y="98" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" leading="1.3">Transform raw enterprise data into interactive strategic decision dashboards.</text>
    <text x="18" y="140" fill="#2563EB" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Microsoft Fabric &amp; BI →</text>

    <!-- Card 2 -->
    <g transform="translate(222, 0)">
      <rect width="206" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#DBEAFE"/>
      <text x="36" y="42" fill="#1D4ED8" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">⚙️</text>
      <text x="18" y="78" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Full Stack Engineering</text>
      <text x="18" y="98" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" leading="1.3">Modern scalable web architectures built on Next.js, Node.js, and cloud backends.</text>
      <text x="18" y="140" fill="#2563EB" font-family="system-ui, sans-serif" font-size="11" font-weight="700">High-Concurrency Apps →</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(444, 0)">
      <rect width="206" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#DBEAFE"/>
      <text x="36" y="42" fill="#1D4ED8" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🛡️</text>
      <text x="18" y="78" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="700">24/7 Cloud Assurance</text>
      <text x="18" y="98" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" leading="1.3">Proactive infrastructure monitoring, automated security, and 99.9% uptime SLAs.</text>
      <text x="18" y="140" fill="#2563EB" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Global Cloud SLAs →</text>
    </g>
