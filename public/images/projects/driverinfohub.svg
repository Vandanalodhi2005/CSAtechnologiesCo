<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <!-- Frame -->
  <rect width="700" height="440" rx="10" fill="#0B132B" stroke="#1C2541" stroke-width="2"/>
  
  <!-- Top Bar -->
  <rect width="700" height="36" rx="10" fill="#070D1F" />
  <circle cx="20" cy="18" r="5" fill="#EF4444" />
  <circle cx="36" cy="18" r="5" fill="#F59E0B" />
  <circle cx="52" cy="18" r="5" fill="#10B981" />
  <rect x="120" y="8" width="460" height="20" rx="10" fill="#1C2541" stroke="#3A506B" stroke-width="1"/>
  <text x="350" y="22" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">https://hub.logixfleet.com/drivers/telematics</text>

  <!-- Sidebar + Content Split -->
  <!-- Sidebar -->
  <rect y="36" width="160" height="404" fill="#0E1B38" stroke="#1C2541" stroke-width="1"/>
  <text x="20" y="65" fill="#38BDF8" font-family="sans-serif" font-size="14" font-weight="800">DRIVER <tspan fill="#FFFFFF">HUB</tspan></text>
  
  <rect x="10" y="85" width="140" height="30" rx="6" fill="#0B84F3" />
  <text x="25" y="105" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">📊 Fleet Dashboard</text>
  
  <text x="25" y="145" fill="#94A3B8" font-family="sans-serif" font-size="11">🚛 Driver Directory</text>
  <text x="25" y="180" fill="#94A3B8" font-family="sans-serif" font-size="11">📑 Compliance OCR</text>
  <text x="25" y="215" fill="#94A3B8" font-family="sans-serif" font-size="11">⏱️ Hours of Service</text>
  <text x="25" y="250" fill="#94A3B8" font-family="sans-serif" font-size="11">⚠️ Safety Incidents</text>
  <text x="25" y="285" fill="#94A3B8" font-family="sans-serif" font-size="11">⚙️ Settings</text>

  <!-- Main Content Area -->
  <g transform="translate(175, 45)">
    <!-- Header Row -->
    <text x="0" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">Driver Telematics &amp; Compliance</text>
    <rect x="360" y="8" width="150" height="26" rx="6" fill="#1C2541" stroke="#3A506B" stroke-width="1"/>
    <text x="435" y="25" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">🔍 Search 3,500 drivers...</text>

    <!-- Top KPI Cards -->
    <g transform="translate(0, 45)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="120" height="65" rx="6" fill="#102040" stroke="#1D3E6B" stroke-width="1"/>
      <text x="12" y="20" fill="#94A3B8" font-family="sans-serif" font-size="9">ACTIVE DRIVERS</text>
      <text x="12" y="45" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">3,412</text>
      <text x="75" y="45" fill="#34D399" font-family="sans-serif" font-size="9">● 97.4%</text>

      <!-- KPI 2 -->
      <rect x="130" y="0" width="120" height="65" rx="6" fill="#102040" stroke="#1D3E6B" stroke-width="1"/>
      <text x="142" y="20" fill="#94A3B8" font-family="sans-serif" font-size="9">COMPLIANCE</text>
      <text x="142" y="45" fill="#38BDF8" font-family="sans-serif" font-size="18" font-weight="700">99.7%</text>
      <text x="195" y="45" fill="#38BDF8" font-family="sans-serif" font-size="9">▲ +17%</text>

      <!-- KPI 3 -->
      <rect x="260" y="0" width="120" height="65" rx="6" fill="#102040" stroke="#1D3E6B" stroke-width="1"/>
      <text x="272" y="20" fill="#94A3B8" font-family="sans-serif" font-size="9">AVG SAFETY SCORE</text>
      <text x="272" y="45" fill="#FBBF24" font-family="sans-serif" font-size="18" font-weight="700">94/100</text>
      <text x="335" y="45" fill="#FBBF24" font-family="sans-serif" font-size="9">Grade A</text>

      <!-- KPI 4 -->
      <rect x="390" y="0" width="120" height="65" rx="6" fill="#102040" stroke="#1D3E6B" stroke-width="1"/>
      <text x="402" y="20" fill="#94A3B8" font-family="sans-serif" font-size="9">EXPIRING LICENSES</text>
      <text x="402" y="45" fill="#EF4444" font-family="sans-serif" font-size="18" font-weight="700">4 Alert</text>
      <text x="465" y="45" fill="#EF4444" font-family="sans-serif" font-size="9">Auto SMS</text>
    </g>

    <!-- Table of Drivers -->
    <g transform="translate(0, 125)">
      <rect width="510" height="245" rx="6" fill="#0C1B33" stroke="#1D3E6B" stroke-width="1"/>
      
      <!-- Table Header -->
      <rect width="510" height="28" fill="#132747" rx="6"/>
      <text x="15" y="18" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700">DRIVER NAME</text>
      <text x="140" y="18" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700">VEHICLE</text>
      <text x="230" y="18" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700">STATUS</text>
      <text x="320" y="18" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700">HOURS REMAINING</text>
      <text x="440" y="18" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700">SCORE</text>

      <!-- Row 1 -->
      <line x1="0" y1="65" x2="510" y2="65" stroke="#172D4D" stroke-width="1"/>
      <circle cx="25" cy="46" r="10" fill="#0B84F3" />
      <text x="25" y="50" fill="#FFFFFF" font-family="sans-serif" font-size="9" text-anchor="middle">MK</text>
      <text x="45" y="50" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">Manpreet Kumar</text>
      <text x="140" y="50" fill="#94A3B8" font-family="sans-serif" font-size="11">HR-55-A-9281</text>
      <rect x="230" y="38" width="60" height="18" rx="9" fill="#065F46" />
      <text x="260" y="51" fill="#34D399" font-family="sans-serif" font-size="9" text-anchor="middle">● On Route</text>
      <text x="320" y="50" fill="#FFFFFF" font-family="sans-serif" font-size="11">6 hrs 45 mins</text>
      <text x="440" y="50" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700">98%</text>

      <!-- Row 2 -->
      <line x1="0" y1="105" x2="510" y2="105" stroke="#172D4D" stroke-width="1"/>
      <circle cx="25" cy="86" r="10" fill="#8B5CF6" />
      <text x="25" y="90" fill="#FFFFFF" font-family="sans-serif" font-size="9" text-anchor="middle">RS</text>
      <text x="45" y="90" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">Rajesh Singh</text>
      <text x="140" y="90" fill="#94A3B8" font-family="sans-serif" font-size="11">DL-01-X-4412</text>
      <rect x="230" y="78" width="60" height="18" rx="9" fill="#065F46" />
      <text x="260" y="91" fill="#34D399" font-family="sans-serif" font-size="9" text-anchor="middle">● On Route</text>
      <text x="320" y="90" fill="#FFFFFF" font-family="sans-serif" font-size="11">4 hrs 12 mins</text>
      <text x="440" y="90" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700">96%</text>

      <!-- Row 3 -->
      <line x1="0" y1="145" x2="510" y2="145" stroke="#172D4D" stroke-width="1"/>
      <circle cx="25" cy="126" r="10" fill="#EC4899" />
      <text x="25" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="9" text-anchor="middle">DY</text>
      <text x="45" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">Deepak Yadav</text>
      <text x="140" y="130" fill="#94A3B8" font-family="sans-serif" font-size="11">UP-16-Z-1049</text>
      <rect x="230" y="118" width="60" height="18" rx="9" fill="#92400E" />
      <text x="260" y="131" fill="#FBBF24" font-family="sans-serif" font-size="9" text-anchor="middle">⏸ Rest Break</text>
      <text x="320" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="11">9 hrs 00 mins</text>
      <text x="440" y="130" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700">92%</text>

      <!-- Row 4 -->
      <line x1="0" y1="185" x2="510" y2="185" stroke="#172D4D" stroke-width="1"/>
      <circle cx="25" cy="166" r="10" fill="#06B6D4" />
      <text x="25" y="170" fill="#FFFFFF" font-family="sans-serif" font-size="9" text-anchor="middle">AS</text>
      <text x="45" y="170" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">Arjun Sharma</text>
      <text x="140" y="170" fill="#94A3B8" font-family="sans-serif" font-size="11">MH-04-T-8823</text>
      <rect x="230" y="158" width="60" height="18" rx="9" fill="#1E293B" />
      <text x="260" y="171" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">○ Off Duty</text>
      <text x="320" y="170" fill="#64748B" font-family="sans-serif" font-size="11">--</text>
      <text x="440" y="170" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700">95%</text>
    </g>
  </g>
</svg>
