<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <defs>
    <linearGradient id="pcBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="pcShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect width="700" height="440" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Browser Chrome / Tab -->
  <rect width="700" height="36" rx="10" fill="#F1F5F9" />
  <circle cx="20" cy="18" r="5" fill="#EF4444" />
  <circle cx="36" cy="18" r="5" fill="#F59E0B" />
  <circle cx="52" cy="18" r="5" fill="#10B981" />
  <rect x="120" y="8" width="460" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="350" y="22" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">https://printscarts.com/custom-apparel</text>

  <!-- E-commerce Navbar -->
  <rect y="36" width="700" height="46" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
  <text x="25" y="65" fill="#DC2626" font-family="sans-serif" font-size="18" font-weight="800">PRINTS<tspan fill="#0B1220">CARTS</tspan></text>
  <text x="170" y="64" fill="#334155" font-family="sans-serif" font-size="12" font-weight="600">Custom T-Shirts</text>
  <text x="280" y="64" fill="#64748B" font-family="sans-serif" font-size="12">Mugs & Bottles</text>
  <text x="385" y="64" fill="#64748B" font-family="sans-serif" font-size="12">Hoodies</text>
  <text x="460" y="64" fill="#64748B" font-family="sans-serif" font-size="12">Bulk Orders</text>
  <rect x="580" y="47" width="95" height="26" rx="13" fill="#DC2626" />
  <text x="627" y="64" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">🛒 Cart (3)</text>

  <!-- Hero Promo Banner -->
  <g transform="translate(25, 95)">
    <rect width="650" height="120" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="25" y="45" fill="#991B1B" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">ON-DEMAND CUSTOM PRINTING</text>
    <text x="25" y="75" fill="#0B1220" font-family="sans-serif" font-size="20" font-weight="800">Design Your Custom Apparel In 60 Seconds</text>
    <text x="25" y="98" fill="#475569" font-family="sans-serif" font-size="12">High quality DTG & Screen printing with live 3D preview & zero setup fees.</text>
    <rect x="520" y="45" width="105" height="34" rx="6" fill="#DC2626" />
    <text x="572" y="67" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Design Now</text>
  </g>

  <!-- Product Catalog Grid -->
  <g transform="translate(25, 230)">
    <!-- Product 1 -->
    <rect x="0" y="0" width="150" height="185" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#pcShadow)"/>
    <rect x="10" y="10" width="130" height="95" rx="4" fill="#F8FAFC" />
    <circle cx="75" cy="58" r="28" fill="#E2E8F0" />
    <text x="75" y="64" fill="#64748B" font-family="sans-serif" font-size="20" text-anchor="middle">👕</text>
    <text x="12" y="125" fill="#0B1220" font-family="sans-serif" font-size="12" font-weight="700">Premium Bio-Wash Tee</text>
    <text x="12" y="142" fill="#16A34A" font-family="sans-serif" font-size="11" font-weight="600">₹399 <tspan fill="#94A3B8" font-weight="400" text-decoration="line-through">₹799</tspan></text>
    <rect x="12" y="152" width="126" height="22" rx="4" fill="#0B1220" />
    <text x="75" y="167" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Customize</text>

    <!-- Product 2 -->
    <rect x="165" y="0" width="150" height="185" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#pcShadow)"/>
    <rect x="175" y="10" width="130" height="95" rx="4" fill="#F8FAFC" />
    <circle cx="240" cy="58" r="28" fill="#E2E8F0" />
    <text x="240" y="64" fill="#64748B" font-family="sans-serif" font-size="20" text-anchor="middle">☕</text>
    <text x="177" y="125" fill="#0B1220" font-family="sans-serif" font-size="12" font-weight="700">Custom Ceramic Mug</text>
    <text x="177" y="142" fill="#16A34A" font-family="sans-serif" font-size="11" font-weight="600">₹249 <tspan fill="#94A3B8" font-weight="400" text-decoration="line-through">₹499</tspan></text>
    <rect x="177" y="152" width="126" height="22" rx="4" fill="#0B1220" />
    <text x="240" y="167" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Customize</text>

    <!-- Product 3 -->
    <rect x="330" y="0" width="150" height="185" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#pcShadow)"/>
    <rect x="340" y="10" width="130" height="95" rx="4" fill="#F8FAFC" />
    <circle cx="405" cy="58" r="28" fill="#E2E8F0" />
    <text x="405" y="64" fill="#64748B" font-family="sans-serif" font-size="20" text-anchor="middle">🧥</text>
    <text x="342" y="125" fill="#0B1220" font-family="sans-serif" font-size="12" font-weight="700">Oversized Winter Hoodie</text>
    <text x="342" y="142" fill="#16A34A" font-family="sans-serif" font-size="11" font-weight="600">₹999 <tspan fill="#94A3B8" font-weight="400" text-decoration="line-through">₹1,799</tspan></text>
    <rect x="342" y="152" width="126" height="22" rx="4" fill="#0B1220" />
    <text x="405" y="167" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Customize</text>

    <!-- Product 4 -->
    <rect x="495" y="0" width="155" height="185" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#pcShadow)"/>
    <rect x="505" y="10" width="135" height="95" rx="4" fill="#F8FAFC" />
    <circle cx="572" cy="58" r="28" fill="#E2E8F0" />
    <text x="572" y="64" fill="#64748B" font-family="sans-serif" font-size="20" text-anchor="middle">🧢</text>
    <text x="507" y="125" fill="#0B1220" font-family="sans-serif" font-size="12" font-weight="700">Embroidered Cotton Cap</text>
    <text x="507" y="142" fill="#16A34A" font-family="sans-serif" font-size="11" font-weight="600">₹299 <tspan fill="#94A3B8" font-weight="400" text-decoration="line-through">₹599</tspan></text>
    <rect x="507" y="152" width="131" height="22" rx="4" fill="#0B1220" />
    <text x="572" y="167" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Customize</text>
  </g>
</svg>
