<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061426"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B84F3"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Central Next.js & Speed Graphic -->
  <circle cx="400" cy="210" r="130" fill="none" stroke="rgba(11, 132, 243, 0.2)" stroke-width="2"/>
  <circle cx="400" cy="210" r="100" fill="rgba(11, 132, 243, 0.06)" stroke="#0B84F3" stroke-width="2" stroke-dasharray="12 6" filter="url(#glow)"/>

  <!-- Next.js "N" logo stylized -->
  <path d="M 370 160 L 370 260 M 370 160 L 430 260 M 430 160 L 430 220" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Speed Badges -->
  <g transform="translate(120, 160)">
    <rect width="160" height="70" rx="8" fill="#0B1E38" stroke="rgba(11, 132, 243, 0.4)"/>
    <text x="20" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">PERFORMANCE</text>
    <text x="20" y="55" fill="#10B981" font-family="system-ui, sans-serif" font-size="22" font-weight="800">100 / 100</text>
  </g>

  <g transform="translate(520, 160)">
    <rect width="160" height="70" rx="8" fill="#0B1E38" stroke="rgba(11, 132, 243, 0.4)"/>
    <text x="20" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">SERVER LATENCY</text>
    <text x="20" y="55" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="22" font-weight="800">&lt; 0.8s</text>
  </g>

  <!-- Tag Banner at bottom -->
  <rect x="250" y="360" width="300" height="36" rx="18" fill="rgba(11, 132, 243, 0.15)" stroke="#0B84F3" stroke-width="1"/>
  <text x="400" y="383" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">NEXT.js 14 • EDGE SSR ARCHITECTURE</text>
</svg>
